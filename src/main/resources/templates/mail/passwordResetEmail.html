<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="vi">
  <head>
    <title th:text="#{email.reset.title}">Đặt lại mật khẩu Mầm</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body style="margin: 0; padding: 24px; background: #f4f5fb; font-family: Arial, Helvetica, sans-serif; color: #1f2937">
    <div style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px">
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 20px"><tr><td><img th:src="@{|${baseUrl}/icons/icon-96x96.png|}" src="icons/icon-96x96.png" width="40" height="40" alt="" style="display: block; border: 0; border-radius: 10px" /></td><td style="padding-left: 10px; font-size: 24px; font-weight: 900; color: #1e1b4b">Mầm<span style="color: #fb923c">.</span></td></tr></table>
      <p th:text="#{email.reset.greeting(${user.firstName != null ? user.firstName : user.login})}">Xin chào</p>
      <p th:text="#{email.reset.text1}">Có yêu cầu đặt lại mật khẩu cho tài khoản của bạn:</p>
      <p style="margin: 24px 0">
        <a
          th:with="url=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})"
          th:href="${url}"
          th:text="#{email.reset.button}"
          style="display: inline-block; background: #4f46e5; color: #ffffff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold"
          >Đặt lại mật khẩu</a
        >
      </p>
      <p style="font-size: 13px; color: #6b7280" th:text="#{email.linkHint}">Nếu nút không hoạt động, hãy mở liên kết sau:</p>
      <p style="font-size: 13px; word-break: break-all">
        <a th:with="url=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})" th:href="${url}" th:text="${url}">link</a>
      </p>
      <p style="font-size: 13px; color: #6b7280" th:text="#{email.reset.ignore}">Liên kết có hiệu lực trong 24 giờ.</p>
      <p>
        <span th:text="#{email.reset.text2}">Trân trọng,</span><br />
        <em th:text="#{email.signature}">Đội ngũ Mầm</em>
      </p>
    </div>
  </body>
</html>
