name: Keep the Space awake

# Free Hugging Face Spaces sleep after 48 hours without visitors; a ping twice a day keeps the app warm.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 30 "${{ vars.APP_URL }}/management/health/liveness"
